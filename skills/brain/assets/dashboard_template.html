<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Brain Dashboard</title>
<!--
  WHY:  Read-only visual overview of the second-brain store, no server, no network.
  WHAT: Template filled by scripts/dashboard.py: the data placeholder token is
        replaced by the store snapshot (JSON). Inline CSS + vanilla JS only; works from file://.
  WHO:  Generated by `brain_cli.py dashboard` / scripts/dashboard.py. Do not edit
        the generated STORE/dashboard.html; it is overwritten on every run.
-->
<style>
:root {
  --bg: #0B0D11; --surface: #12151B; --elevated: #191D25;
  --border: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.18);
  --accent: #4FA2FA; --accent-ink: #07121f;
  --text: rgba(255,255,255,.94); --text2: rgba(255,255,255,.62); --text3: rgba(255,255,255,.42);
  --warn: #EDB54F; --danger: #DE5C5C; --ok: #5CC38A;
  --r-lg: 12px; --r-md: 10px; --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --shadow: 0 8px 30px rgba(0,0,0,.45);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #F4F5F8; --surface: #FFFFFF; --elevated: #EEF0F5;
  --border: rgba(0,0,0,.10); --border-strong: rgba(0,0,0,.24);
  --accent: #1B64C4; --accent-ink: #ffffff;
  --text: rgba(12,14,20,.94); --text2: rgba(12,14,20,.68); --text3: rgba(12,14,20,.52);
  --warn: #8F5F00; --danger: #B02F2F; --ok: #1E7A4C;
  --shadow: 0 8px 30px rgba(20,30,50,.18);
  color-scheme: light;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F4F5F8; --surface: #FFFFFF; --elevated: #EEF0F5;
    --border: rgba(0,0,0,.10); --border-strong: rgba(0,0,0,.24);
    --accent: #1B64C4; --accent-ink: #ffffff;
    --text: rgba(12,14,20,.94); --text2: rgba(12,14,20,.68); --text3: rgba(12,14,20,.52);
    --warn: #8F5F00; --danger: #B02F2F; --ok: #1E7A4C;
    --shadow: 0 8px 30px rgba(20,30,50,.18);
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 13px; line-height: 1.5;
  display: flex; flex-direction: column; overflow-x: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

header.top {
  display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap;
  padding: var(--s3) var(--s4); border-bottom: 1px solid var(--border); background: var(--surface);
}
header.top h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .02em; }
header.top .meta { color: var(--text3); font-size: 11px; flex: 1 1 200px; min-width: 0; overflow-wrap: anywhere; }
.btn {
  background: var(--elevated); border: 1px solid var(--border); border-radius: var(--r-md);
  padding: var(--s2) var(--s3); min-height: 32px; display: inline-flex; align-items: center; gap: var(--s2);
}
.btn:hover { border-color: var(--border-strong); }
.btn.sm { padding: var(--s1) var(--s2); min-height: 28px; font-size: 12px; }
nav.tabs { display: flex; gap: var(--s1); }
nav.tabs button { background: transparent; border: 1px solid transparent; border-radius: var(--r-md); padding: var(--s2) var(--s3); color: var(--text2); }
nav.tabs button[aria-current="page"] { background: var(--elevated); border-color: var(--border); color: var(--text); }

.banner {
  margin: var(--s4) var(--s4) 0; padding: var(--s3) var(--s4); border-radius: var(--r-lg);
  border: 1px solid var(--warn); background: color-mix(in srgb, var(--warn) 14%, var(--surface)); color: var(--text);
  display: flex; gap: var(--s3); align-items: center;
}
.banner strong { color: var(--warn); letter-spacing: .06em; }
.notes { margin: var(--s3) var(--s4) 0; display: flex; flex-direction: column; gap: var(--s2); }
.note { color: var(--text2); border-left: 3px solid var(--warn); padding-left: var(--s3); font-size: 12px; }
.note.err { border-color: var(--danger); }

main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.view { display: none; }
.view.on { display: block; }
#view-overview.on, #view-short.on { padding: var(--s4); max-width: 1200px; width: 100%; margin: 0 auto; }
#view-graph.on { display: flex; flex: 1 1 auto; min-height: 0; position: relative; }

.grid { display: grid; gap: var(--s4); grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
  padding: var(--s4); text-align: left; display: block; width: 100%; min-width: 0;
}
div.card.click { cursor: pointer; }
div.card.click:hover { border-color: var(--accent); background: var(--elevated); }
.card h2 { margin: 0 0 var(--s3); font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--text2); font-weight: 600; }
.card .hint { color: var(--text3); font-size: 11px; margin-top: var(--s3); }
.growth { grid-column: 1 / -1; }
.stat { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s3); margin-top: var(--s3); }
.stat .v { font-size: 22px; font-weight: 600; }
.stat .l { color: var(--text2); font-size: 12px; }
.gauge { height: 8px; border-radius: 99px; background: var(--elevated); overflow: hidden; margin-top: var(--s2); border: 1px solid var(--border); }
.gauge > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.gauge.warn > i { background: var(--warn); }
.gauge.bad > i { background: var(--danger); }
.big3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s3); }
.big3 .v { font-size: 22px; font-weight: 600; display: block; }
.big3 .l { color: var(--text2); font-size: 11px; }
.chip { display: inline-block; padding: 1px var(--s2); border-radius: 99px; border: 1px solid var(--border); font-size: 11px; color: var(--text2); background: var(--elevated); }
.chip.warn { color: var(--warn); border-color: var(--warn); }
.chip.bad { color: var(--danger); border-color: var(--danger); }
.chip.ok { color: var(--ok); border-color: var(--ok); }

.charts { display: grid; gap: var(--s4); grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
.chart { position: relative; min-width: 0; }
.chart .ct { display: flex; justify-content: space-between; gap: var(--s2); font-size: 12px; color: var(--text2); }
.chart .ct b { color: var(--text); }
.chart svg { display: block; width: 100%; height: 140px; overflow: visible; }
.chart svg:focus-visible { outline-offset: 4px; border-radius: 4px; }
.tip {
  position: absolute; pointer-events: none; z-index: 5; background: var(--elevated); border: 1px solid var(--border-strong);
  border-radius: var(--r-md); padding: var(--s2) var(--s3); font-size: 11px; white-space: nowrap; box-shadow: var(--shadow); display: none;
}
.empty { color: var(--text3); padding: var(--s4); border: 1px dashed var(--border-strong); border-radius: var(--r-md); text-align: center; }

.bar { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; margin-bottom: var(--s3); }
.bar h2 { margin: 0; font-size: 15px; }
.kv { color: var(--text2); font-size: 12px; }
.lines { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: auto; max-height: calc(100vh - 220px); min-height: 120px; }
.ln { display: flex; gap: var(--s3); padding: 1px var(--s3); white-space: pre-wrap; overflow-wrap: anywhere; }
.ln:hover { background: var(--elevated); }
.ln .n { flex: 0 0 4ch; text-align: right; color: var(--text3); user-select: none; }
.ln .t { flex: 1 1 auto; min-width: 0; }
.ln.over-lines { background: color-mix(in srgb, var(--danger) 12%, transparent); }
.ln.over-width .n { color: var(--warn); font-weight: 700; }
.ln mark { background: color-mix(in srgb, var(--danger) 35%, transparent); color: var(--text); border-radius: 2px; }

/* graph */
.gwrap { position: relative; flex: 1 1 auto; min-width: 0; min-height: 0; background: var(--bg); }
#gc { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#gc:focus-visible { outline-offset: -3px; }
.gtools { position: absolute; top: var(--s3); left: var(--s3); right: var(--s3); display: flex; gap: var(--s2); flex-wrap: wrap; align-items: flex-start; pointer-events: none; z-index: 3; }
.gtools > * { pointer-events: auto; }
.search { position: relative; flex: 1 1 200px; max-width: 360px; }
.search input {
  width: 100%; background: var(--surface); color: var(--text); border: 1px solid var(--border-strong); border-radius: var(--r-md);
  padding: var(--s2) var(--s3); min-height: 34px; font: inherit;
}
.search input::placeholder { color: var(--text3); }
.results {
  position: absolute; left: 0; right: 0; top: 38px; background: var(--surface); border: 1px solid var(--border-strong);
  border-radius: var(--r-md); max-height: 260px; overflow: auto; display: none; box-shadow: var(--shadow);
}
.results.on { display: block; }
.results button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: var(--s2) var(--s3); border-bottom: 1px solid var(--border); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.results button:hover, .results button:focus-visible { background: var(--elevated); }
.zoom { display: flex; gap: var(--s1); }
.legend {
  position: absolute; left: var(--s3); bottom: var(--s3); background: color-mix(in srgb, var(--surface) 88%, transparent);
  border: 1px solid var(--border); border-radius: var(--r-md); padding: var(--s2) var(--s3); font-size: 11px; color: var(--text2); z-index: 2;
  display: flex; gap: var(--s3); flex-wrap: wrap; max-width: calc(100% - 24px);
}
.legend i { display: inline-block; vertical-align: middle; margin-right: 6px; }
.legend .dot { width: 10px; height: 10px; border-radius: 50%; }
.legend .ln1 { width: 18px; height: 0; border-top: 2px dashed var(--accent); }
.legend .ln2 { width: 18px; height: 0; border-top: 1px solid var(--text3); }
.gempty { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: var(--s4); z-index: 1; }
.gempty.on { display: flex; }
.gstat { position: absolute; right: var(--s3); bottom: var(--s3); color: var(--text3); font-size: 11px; z-index: 2; }

aside.panel {
  flex: 0 0 420px; max-width: 48vw; background: var(--surface); border-left: 1px solid var(--border);
  display: none; flex-direction: column; min-height: 0; z-index: 4;
}
aside.panel.on { display: flex; }
.ph { padding: var(--s3) var(--s4); border-bottom: 1px solid var(--border); display: flex; gap: var(--s2); align-items: flex-start; }
.ph h3 { margin: 0; font-size: 14px; flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.pb { overflow: auto; padding: var(--s3) var(--s4) var(--s4); flex: 1 1 auto; min-height: 0; }
.pact { display: flex; gap: var(--s2); flex-wrap: wrap; margin-bottom: var(--s3); }
.pb h4 { margin: var(--s4) 0 var(--s2); font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--text2); }
table.fm { border-collapse: collapse; width: 100%; font-size: 12px; }
table.fm td { border-top: 1px solid var(--border); padding: var(--s1) var(--s2); vertical-align: top; overflow-wrap: anywhere; }
table.fm td:first-child { color: var(--text2); width: 28%; white-space: nowrap; }
.md { overflow-wrap: anywhere; }
.md p { margin: 0 0 var(--s3); }
.md .h { font-weight: 700; margin: var(--s4) 0 var(--s2); color: var(--text); }
.md .h1 { font-size: 16px; } .md .h2 { font-size: 14px; }
.md ul, .md ol { margin: 0 0 var(--s3); padding-left: 22px; }
.md pre { background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-md); padding: var(--s3); overflow: auto; margin: 0 0 var(--s3); }
.md code { background: var(--elevated); padding: 0 4px; border-radius: 4px; }
.md pre code { background: none; padding: 0; }
.md blockquote { margin: 0 0 var(--s3); padding-left: var(--s3); border-left: 3px solid var(--border-strong); color: var(--text2); }
.md hr { border: 0; border-top: 1px solid var(--border); margin: var(--s4) 0; }
.md .unres { color: var(--danger); text-decoration: line-through; }
.links { list-style: none; padding: 0; margin: 0; font-size: 12px; }
.links li { padding: 2px 0; overflow-wrap: anywhere; }
.links button, .md button.lk { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-align: left; }

.toast {
  position: fixed; bottom: var(--s4); left: 50%; transform: translateX(-50%); background: var(--elevated); border: 1px solid var(--border-strong);
  border-radius: var(--r-md); padding: var(--s2) var(--s4); box-shadow: var(--shadow); z-index: 20; display: none;
}
.toast.on { display: block; }

@media (max-width: 760px) {
  aside.panel { position: absolute; inset: 0; max-width: none; flex-basis: auto; border-left: 0; }
  header.top .meta { order: 5; flex-basis: 100%; }
  .big3 .v, .stat .v { font-size: 18px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<header class="top">
  <h1>&#129504; Brain</h1>
  <nav class="tabs" aria-label="Views">
    <button type="button" data-view="overview">Overview</button>
    <button type="button" data-view="short">Short memory</button>
    <button type="button" data-view="graph">Graph</button>
  </nav>
  <div class="meta" id="meta"></div>
  <button type="button" class="btn sm" id="theme" aria-label="Toggle colour theme">Theme</button>
</header>
<div id="banner" role="alert"></div>
<div class="notes" id="notes"></div>
<main>
  <section class="view" id="view-overview" aria-label="Overview"></section>
  <section class="view" id="view-short" aria-label="Short memory (read-only)"></section>
  <section class="view" id="view-graph" aria-label="Long-memory graph">
    <div class="gwrap" id="gwrap">
      <canvas id="gc" tabindex="0" role="img" aria-label="Force-directed graph of long-memory pages and tags. Use the search box or the arrow keys, plus and minus to navigate."></canvas>
      <div class="gtools">
        <div class="search">
          <label class="sr" for="gq">Filter pages and tags</label>
          <input id="gq" type="search" placeholder="Filter pages / tags..." autocomplete="off">
          <div class="results" id="gres"></div>
        </div>
        <div class="zoom">
          <button type="button" class="btn sm" id="zin" aria-label="Zoom in">+</button>
          <button type="button" class="btn sm" id="zout" aria-label="Zoom out">&minus;</button>
          <button type="button" class="btn sm" id="zfit">Fit</button>
        </div>
      </div>
      <div class="gempty" id="gempty"><div class="empty">No long-memory pages yet. They appear here after the first digest.</div></div>
      <div class="legend" aria-hidden="true">
        <span><i class="dot" style="background:var(--accent)"></i>tag</span>
        <span><i class="dot" style="background:var(--text)"></i>page</span>
        <span><i class="ln2"></i>page &rarr; tag</span>
        <span><i class="ln1"></i>page &rarr; page link</span>
      </div>
      <div class="gstat" id="gstat"></div>
    </div>
    <aside class="panel" id="panel" aria-label="Page details"></aside>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>

<script id="brain-data" type="application/json">__BRAIN_DATA__</script>
<script>
(function () {
'use strict';
var D;
try { D = JSON.parse(document.getElementById('brain-data').textContent); }
catch (e) { document.body.textContent = 'Dashboard data could not be loaded: ' + e.message; return; }

/* ---------- helpers ---------- */
function $(id) { return document.getElementById(id); }
function el(tag, props, kids) {
  var n = document.createElement(tag), k;
  props = props || {};
  for (k in props) {
    if (k === 'text') n.textContent = props[k];
    else if (k === 'cls') n.className = props[k];
    else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), props[k]);
    else n.setAttribute(k, props[k]);
  }
  (kids || []).forEach(function (c) { if (c != null) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return n;
}
function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
function fmtBytes(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
  return (b / 1048576).toFixed(2) + ' MB';
}
function fmtTs(s) { var d = new Date(s); return isNaN(d) ? String(s) : d.toLocaleString(); }
function fmtDay(s) { var d = new Date(s); return isNaN(d) ? String(s) : d.toLocaleDateString(); }
var toastT;
function toast(msg) {
  var t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('on'); }, 1800);
}
function copy(text, what) {
  function fallback() {
    var ta = el('textarea', { 'aria-hidden': 'true' });
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? 'Copied ' + what : 'Copy failed');
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { toast('Copied ' + what); }, fallback);
  } else fallback();
}
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

/* ---------- theme ---------- */
var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;
function effectiveTheme() {
  var t = document.documentElement.getAttribute('data-theme');
  return t || (mq && mq.matches ? 'light' : 'dark');
}
function setTheme(t, persist, follow) {
  if (!follow) document.documentElement.setAttribute('data-theme', t);
  if (persist) { try { localStorage.setItem('brain-theme', t); } catch (e) { /* storage unavailable */ } }
  $('theme').textContent = t === 'dark' ? 'Light theme' : 'Dark theme';
  readColors(); redrawAll();
}
try {
  var saved = localStorage.getItem('brain-theme');
  if (saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved);
} catch (e) { /* ignore */ }
$('theme').addEventListener('click', function () { setTheme(effectiveTheme() === 'dark' ? 'light' : 'dark', true); });
if (mq && mq.addEventListener) mq.addEventListener('change', function () { if (!document.documentElement.getAttribute('data-theme')) setTheme(effectiveTheme(), false, true); });

/* ---------- derived data ---------- */
var pages = D.pages || [];
var pageBy = {};
pages.forEach(function (p) { pageBy[p.path] = p; });
var unresolved = 0, badFm = 0;
pages.forEach(function (p) {
  if (!p.fm_ok) badFm++;
  (p.links || []).forEach(function (l) { if (!l.resolved) unresolved++; });
});
var S = D.short;
var STORE = D.store || '';

/* ---------- header / banner / notes ---------- */
$('meta').textContent = 'store: ' + STORE + '  |  generated ' + fmtTs(D.generated_at) + ' (snapshot, re-run the dashboard command to refresh)';
(function () {
  var b = $('banner');
  if (!D.state.enabled) {
    b.appendChild(el('div', { cls: 'banner' }, [
      el('strong', { text: 'BRAIN DISABLED' }),
      el('span', { text: D.state.error ? D.state.error + ' (failing closed).' : 'state.json has enabled=false: hooks do nothing. Run "brain on" to enable. This view is read-only.' })
    ]));
  }
  var n = $('notes');
  function note(t, err) { n.appendChild(el('div', { cls: 'note' + (err ? ' err' : ''), text: t })); }
  if (D.metrics_skipped) note(D.metrics_skipped + ' malformed metrics line(s) skipped.');
  if (D.pages_unreadable) note(D.pages_unreadable + ' page(s) could not be read.', true);
  if (badFm) note(badFm + ' page(s) have missing/invalid frontmatter (flagged in the graph panel).');
  if (unresolved) note(unresolved + ' unresolved cross-link(s) across pages.');
})();

/* ---------- views ---------- */
var VIEWS = ['overview', 'short', 'graph'];
var current = null;
function show(v) {
  if (VIEWS.indexOf(v) < 0) v = 'overview';
  current = v;
  VIEWS.forEach(function (x) { $('view-' + x).classList.toggle('on', x === v); });
  Array.prototype.forEach.call(document.querySelectorAll('nav.tabs button'), function (b) {
    if (b.getAttribute('data-view') === v) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  if (v === 'overview') renderCharts();
  if (v === 'graph') graphActivate(); else graphDeactivate();
}
function go(v) { if (location.hash !== '#' + v) location.hash = '#' + v; else show(v); }
Array.prototype.forEach.call(document.querySelectorAll('nav.tabs button'), function (b) {
  b.addEventListener('click', function () { go(b.getAttribute('data-view')); });
});
window.addEventListener('hashchange', function () { show(location.hash.slice(1)); });

/* ---------- overview ---------- */
function gaugeClass(ratio) { return ratio > 1 ? 'bad' : (ratio >= 0.8 ? 'warn' : ''); }
function gauge(ratio) {
  var g = el('div', { cls: 'gauge ' + gaugeClass(ratio), role: 'meter', 'aria-valuemin': '0', 'aria-valuemax': '100',
    'aria-valuenow': String(Math.min(100, Math.round(ratio * 100))), 'aria-valuetext': Math.round(ratio * 100) + '%' + (ratio > 1 ? ' (over cap)' : '') });
  g.appendChild(el('i', { style: 'width:' + Math.min(100, ratio * 100) + '%' }));
  return g;
}
function clickCard(fn, kids) {
  var c = el('div', { cls: 'card click', role: 'button', tabindex: '0', onclick: fn }, kids);

    dx = b.x - a.x; dy = b.y - a.y; d = Math.sqrt(dx * dx + dy * dy) || 0.01;
    var len = e.kind === 'tag' ? 60 : 100, str = e.kind === 'tag' ? 0.09 : 0.04;
    f = (d - len) * str * alpha + (d - len) * str * 0.3;
    dx = dx / d * f; dy = dy / d * f;
    a.vx += dx; a.vy += dy; b.vx -= dx; b.vy -= dy;
  }
  for (i = 0; i < n; i++) {
    a = nodes[i];
    a.vx -= a.x * 0.012 * (0.3 + alpha); a.vy -= a.y * 0.012 * (0.3 + alpha);
    if (a.fixed) { a.vx = a.vy = 0; continue; }
    a.vx *= 0.82; a.vy *= 0.82;
    var sp = Math.sqrt(a.vx * a.vx + a.vy * a.vy);
    if (sp > 40) { a.vx = a.vx / sp * 40; a.vy = a.vy / sp * 40; }
    a.x += a.vx; a.y += a.vy;

}

function resizeGraph() {
  var r = $('gwrap').getBoundingClientRect();
  var w = Math.max(1, Math.floor(r.width)), h = Math.max(1, Math.floor(r.height));
  var d = window.devicePixelRatio || 1;

}
function toScreen(n) { return [n.x * cam.k + cam.x, n.y * cam.k + cam.y]; }
function toWorld(sx, sy) { return [(sx - cam.x) / cam.k, (sy - cam.y) / cam.k]; }
function fit() {
  if (!nodes.length) return;
  var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  nodes.forEach(function (n) { if (n.x < x0) x0 = n.x; if (n.x > x1) x1 = n.x; if (n.y < y0) y0 = n.y; if (n.y > y1) y1 = n.y; });
  var w = Math.max(x1 - x0, 60), h = Math.max(y1 - y0, 60), pad = 60;
  var k = Math.min((cw - pad * 2) / w, (ch - pad * 2) / h, 2.5);

}
function centerOn(n) {

}
function zoomAt(f, sx, sy) {
  var nk = Math.min(6, Math.max(0.05, cam.k * f)); f = nk / cam.k;
  cam.x = sx - (sx - cam.x) * f; cam.y = sy - (sy - cam.y) * f; cam.k = nk; dirty = true;
}
function graphDirty() { dirty = true; if (active && !raf) raf = requestAnimationFrame(frame); }

function computeMatches() {
  var q = query.trim().toLowerCase();
  if (!q) { matches = null; return; }
  matches = {};
  nodes.forEach(function (n) {
    var hay = n.kind === 'tag' ? n.label.toLowerCase() :
      (n.page.title + ' ' + n.page.path + ' ' + n.page.description + ' ' + n.page.tags.join(' ')).toLowerCase();
    if (hay.indexOf(q) >= 0) matches[n.id] = true;
  });
}
function draw() {
  dirty = false;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cw, ch);
  var focus = hover || selected, hl = null;
  if (focus && adj[focus]) { hl = {}; hl[focus] = true; for (var k in adj[focus]) hl[k] = true; }
  function lit(id) { if (hl) return !!hl[id]; if (matches) return !!matches[id]; return true; }
  var i, e, n, p, q;
  ctx.lineCap = 'round';
  for (var pass = 0; pass < 2; pass++) {
    var kind = pass === 0 ? 'tag' : 'link';
    ctx.beginPath();
    for (i = 0; i < edges.length; i++) {
      e = edges[i]; if (e.kind !== kind) continue;
      var on = hl ? (hl[e.a.id] && hl[e.b.id] && (e.a.id === focus || e.b.id === focus)) : (matches ? (matches[e.a.id] && matches[e.b.id]) : true);
      if (!on) continue;
      p = toScreen(e.a); q = toScreen(e.b);
      if ((p[0] < -50 && q[0] < -50) || (p[0] > cw + 50 && q[0] > cw + 50) || (p[1] < -50 && q[1] < -50) || (p[1] > ch + 50 && q[1] > ch + 50)) continue;
      ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]);
    }
    ctx.strokeStyle = kind === 'tag' ? C.text3 : C.accent;
    ctx.lineWidth = kind === 'tag' ? 1 : 1.6;
    ctx.setLineDash(kind === 'tag' ? [] : [6, 4]);
    ctx.globalAlpha = (hl || matches) ? 0.95 : (kind === 'tag' ? 0.45 : 0.85);
    ctx.stroke();
    // dimmed edges
    if (hl || matches) {
      ctx.beginPath();
      for (i = 0; i < edges.length; i++) {
        e = edges[i]; if (e.kind !== kind) continue;
        var on2 = hl ? (hl[e.a.id] && hl[e.b.id] && (e.a.id === focus || e.b.id === focus)) : (matches[e.a.id] && matches[e.b.id]);
        if (on2) continue;
        p = toScreen(e.a); q = toScreen(e.b);
        ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]);
      }
      ctx.globalAlpha = 0.06; ctx.stroke();
    }
  }
  ctx.setLineDash([]);
  var showAllLabels = cam.k > (nodes.length > 400 ? 2.2 : 1.15), showTagLabels = cam.k > 0.45 || nodes.length < 60;
  ctx.font = '11px ui-monospace, Menlo, monospace'; ctx.textBaseline = 'middle';
  var labels = [];
  for (i = 0; i < nodes.length; i++) {
    n = nodes[i]; p = toScreen(n);
    var r = n.r * Math.max(0.4, Math.min(1.8, cam.k));
    if (p[0] < -r - 100 || p[0] > cw + r + 100 || p[1] < -r - 20 || p[1] > ch + r + 20) continue;
    var l = lit(n.id), isSel = n.id === selected, isFocus = n.id === focus;
    ctx.globalAlpha = l ? 1 : 0.14;
    ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, 6.2832);
    if (n.kind === 'tag') { ctx.fillStyle = C.accent; ctx.fill(); }
    else {
      var pg = n.page;
      if (pg.status === 'deprecated') { ctx.fillStyle = C.bg; ctx.fill(); ctx.strokeStyle = C.warn; ctx.lineWidth = 1.5; ctx.stroke(); }
      else if (!pg.fm_ok) { ctx.fillStyle = C.danger; ctx.fill(); }
      else { ctx.fillStyle = C.text; ctx.fill(); }
    }
    if (isSel || isFocus || (matches && matches[n.id])) {
      ctx.beginPath(); ctx.arc(p[0], p[1], r + 3, 0, 6.2832);
      ctx.strokeStyle = isSel ? C.warn : C.accent; ctx.lineWidth = 2; ctx.stroke();
    }
    if (l && (isSel || isFocus || (hl && hl[n.id]) || (matches && matches[n.id] && nodes.length < 400) || (n.kind === 'tag' ? showTagLabels : showAllLabels))) labels.push([n, p, r]);
  }
  ctx.globalAlpha = 1; ctx.lineWidth = 3; ctx.lineJoin = 'round';
  labels.forEach(function (it) {
    var t = it[0].label;
    if (t.length > 32) t = t.slice(0, 31) + '…';
    ctx.strokeStyle = C.bg; ctx.strokeText(t, it[1][0] + it[2] + 5, it[1][1]);
    ctx.fillStyle = it[0].kind === 'tag' ? C.accent : C.text2; ctx.fillText(t, it[1][0] + it[2] + 5, it[1][1]);

}
function frame() {
  raf = 0;
  if (!active) return;
  if (alpha > 0.012 || dragNode) {
    var steps = nodes.length > 600 ? 1 : 2;
    for (var s = 0; s < steps; s++) tick();
    dirty = true;
  }
  if (dirty) draw();
  if (alpha > 0.012 || dragNode || dirty) raf = requestAnimationFrame(frame);
}
function nodeAt(sx, sy) {
  var best = null, bd = 1e9;
  for (var i = nodes.length - 1; i >= 0; i--) {
    var n = nodes[i], p = toScreen(n), r = Math.max(8, n.r * Math.max(0.4, Math.min(1.8, cam.k)) + 3);
    var dx = p[0] - sx, dy = p[1] - sy, d = dx * dx + dy * dy;
    if (d <= r * r && d < bd) { bd = d; best = n; }
  }

}
function graphActivate() {
  active = true;
  $('gempty').classList.toggle('on', pages.length === 0 && D.tags.length === 0);
  requestAnimationFrame(function () {
    resizeGraph();
    if (!graphActivate.done) {
      graphActivate.done = true;
      var warm = nodes.length > 600 ? 160 : 220;
      for (var i = 0; i < warm && alpha > 0.02; i++) tick();
      fit();
    }
    if (pendingOpen) { var po = pendingOpen; pendingOpen = null; openPage(po, true); }
    graphDirty();
  });
}
function graphDeactivate() { active = false; if (raf) { cancelAnimationFrame(raf); raf = 0; } }
function redrawAll() { dirty = true; if (current === 'overview') renderCharts(); if (active) graphDirty(); }

/* pointer interaction */
var ptrs = new Map(), dragNode = null, panning = false, moved = 0, startPt = null, pinch = null;
function pos(e) { var r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
cv.addEventListener('pointerdown', function (e) {
  cv.setPointerCapture(e.pointerId);
  var p = pos(e); ptrs.set(e.pointerId, p);
  if (ptrs.size === 2) {
    var a = Array.from(ptrs.values());
    pinch = { d: Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]), cx: (a[0][0] + a[1][0]) / 2, cy: (a[0][1] + a[1][1]) / 2 };
    dragNode = null; panning = false; moved = 99; return;
  }
  moved = 0; startPt = p;
  var n = nodeAt(p[0], p[1]);
  if (n) { dragNode = n; n.fixed = true; alpha = Math.max(alpha, 0.35); }
  else panning = true;
  cv.style.cursor = 'grabbing';
  graphDirty();
});
cv.addEventListener('pointermove', function (e) {
  var p = pos(e);
  if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, p);
  if (pinch && ptrs.size >= 2) {
    var a = Array.from(ptrs.values()), d = Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]);
    var cx = (a[0][0] + a[1][0]) / 2, cy = (a[0][1] + a[1][1]) / 2;
    cam.x += cx - pinch.cx; cam.y += cy - pinch.cy;
    if (pinch.d > 0) zoomAt(d / pinch.d, cx, cy);
    pinch.d = d; pinch.cx = cx; pinch.cy = cy; graphDirty(); return;
  }
  if (ptrs.has(e.pointerId)) {
    var dx = p[0] - startPt[0], dy = p[1] - startPt[1];
    moved = Math.max(moved, Math.hypot(dx, dy));
    if (dragNode) { var w = toWorld(p[0], p[1]); dragNode.x = w[0]; dragNode.y = w[1]; dragNode.vx = dragNode.vy = 0; }
    else if (panning) { cam.x += p[0] - startPt[0]; cam.y += p[1] - startPt[1]; startPt = p; }
    graphDirty(); return;
  }
  var h = nodeAt(p[0], p[1]), id = h ? h.id : null;
  if (id !== hover) { hover = id; cv.style.cursor = h ? 'pointer' : 'grab'; graphDirty(); }
});
function endPtr(e) {
  var was = ptrs.has(e.pointerId);
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (!was) return;
  if (ptrs.size === 0) {
    if (dragNode) {
      dragNode.fixed = false;
      if (moved < 5 && e.type === 'pointerup') clickNode(dragNode);
    } else if (moved < 5 && e.type === 'pointerup') { if (selected) closePanel(); }
    dragNode = null; panning = false; cv.style.cursor = 'grab'; graphDirty();
  }
}
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('pointerleave', function (e) { if (!ptrs.size && hover) { hover = null; graphDirty(); } });
cv.addEventListener('wheel', function (e) {
  e.preventDefault();
  var p = pos(e), dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
  zoomAt(Math.exp(-dy * 0.0015), p[0], p[1]); graphDirty();
}, { passive: false });
cv.addEventListener('keydown', function (e) {
  var step = 40, handled = true;
  if (e.key === 'ArrowLeft') cam.x += step; else if (e.key === 'ArrowRight') cam.x -= step;
  else if (e.key === 'ArrowUp') cam.y += step; else if (e.key === 'ArrowDown') cam.y -= step;
  else if (e.key === '+' || e.key === '=') zoomAt(1.2, cw / 2, ch / 2);
  else if (e.key === '-' || e.key === '_') zoomAt(1 / 1.2, cw / 2, ch / 2);
  else if (e.key === '0') fit();
  else handled = false;
  if (handled) { e.preventDefault(); graphDirty(); }
});
function clickNode(n) {
  if (n.kind === 'tag') { setQuery(n.label); return; }
  openPage(n.page.path, false);
}
$('zin').addEventListener('click', function () { zoomAt(1.3, cw / 2, ch / 2); graphDirty(); });
$('zout').addEventListener('click', function () { zoomAt(1 / 1.3, cw / 2, ch / 2); graphDirty(); });
$('zfit').addEventListener('click', function () { fit(); graphDirty(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && current === 'graph') { if ($('gres').classList.contains('on')) $('gres').classList.remove('on'); else if (selected) closePanel(); } });

/* search */
var gq = $('gq'), gres = $('gres');
function setQuery(q) { gq.value = q; onQuery(); }
function onQuery() {
  query = gq.value; computeMatches(); clear(gres);
  var q = query.trim();
  if (q) {
    var list = nodes.filter(function (n) { return matches[n.id]; });
    list.slice(0, 8).forEach(function (n) {
      gres.appendChild(el('button', { type: 'button', text: (n.kind === 'tag' ? '# ' : '') + (n.kind === 'tag' ? n.label : n.page.title + '  (' + n.page.path + ')'),
        onclick: function () { gres.classList.remove('on'); if (n.kind === 'page') openPage(n.page.path, true); else { centerOn(n); } graphDirty(); } }));
    });
    if (list.length > 8) gres.appendChild(el('div', { cls: 'kv', style: 'padding:6px 12px', text: '+' + (list.length - 8) + ' more highlighted in the graph' }));
    if (!list.length) gres.appendChild(el('div', { cls: 'kv', style: 'padding:6px 12px', text: 'No matches' }));
    gres.classList.add('on');
  } else gres.classList.remove('on');
  $('gstat').textContent = matches ? Object.keys(matches).length + ' match(es)' : '';
  graphDirty();
}
gq.addEventListener('input', onQuery);
gq.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && matches) {
    var first = nodes.filter(function (n) { return matches[n.id]; })[0];
    if (first) { gres.classList.remove('on'); if (first.kind === 'page') openPage(first.page.path, true); else { centerOn(first); graphDirty(); } }
  } else if (e.key === 'ArrowDown') { var b = gres.querySelector('button'); if (b) { e.preventDefault(); b.focus(); } }
});
gres.addEventListener('keydown', function (e) {
  var cur = document.activeElement;
  if (e.key === 'ArrowDown' && cur.nextElementSibling && cur.nextElementSibling.tagName === 'BUTTON') { e.preventDefault(); cur.nextElementSibling.focus(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); if (cur.previousElementSibling) cur.previousElementSibling.focus(); else gq.focus(); }
});
document.addEventListener('pointerdown', function (e) { if (!e.target.closest || !e.target.closest('.search')) gres.classList.remove('on'); });

/* resize */
if (window.ResizeObserver) new ResizeObserver(function () { if (active) { resizeGraph(); graphDirty(); } }).observe($('gwrap'));
window.addEventListener('resize', function () { if (active) { resizeGraph(); graphDirty(); } if (current === 'overview') renderCharts(); });

/* ---------- boot ---------- */
readColors();
setTheme(effectiveTheme(), false, true);
buildGraph();
renderOverview();
renderShort();
$('gstat').textContent = '';
show(location.hash.slice(1) || 'overview');
})();
</script>
